name: Deploy VELI to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: meetveli
      D1_NAME: veli-waitlist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN GitHub Actions secret."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            WHOAMI_JSON=$(wrangler whoami --json 2>/dev/null || true)
            ACCOUNT_ID=$(printf '%s' "$WHOAMI_JSON" | jq -r '.account_id // .account.id // .accounts[0].id // .memberships[0].account.id // .memberships[0].account_id // empty' 2>/dev/null || true)
            if [ -z "$ACCOUNT_ID" ]; then
              ACCOUNT_ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | jq -r '.result[0].id // empty' || true)
            fi
            if [ -z "$ACCOUNT_ID" ]; then
              echo "Could not resolve the Cloudflare account ID from the API token."
              exit 1
            fi
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          fi

      - name: Ensure D1 database exists
        shell: bash
        run: |
          set -euo pipefail
          LIST_JSON=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$D1_NAME&per_page=50")
          DB_ID=$(printf '%s' "$LIST_JSON" | jq -r --arg NAME "$D1_NAME" '.result[]? | select(.name == $NAME) | .uuid' | head -n1)
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            CREATE_JSON=$(curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
              --data "{\"name\":\"$D1_NAME\",\"jurisdiction\":\"eu\"}")
            DB_ID=$(printf '%s' "$CREATE_JSON" | jq -r '.result.uuid // empty')
          fi
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Could not create or resolve the D1 database."
            exit 1
          fi
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Generate Cloudflare Pages config
        shell: bash
        run: |
          cat > wrangler.toml <<EOF
          name = "$PROJECT_NAME"
          pages_build_output_dir = "."
          compatibility_date = "2026-09-28"

          [[d1_databases]]
          binding = "WAITLIST_DB"
          database_name = "$D1_NAME"
          database_id = "$DB_ID"
          EOF

      - name: Apply waitlist schema
        run: wrangler d1 execute "$D1_NAME" --remote --file=schema.sql --yes

      - name: Ensure Pages project exists
        shell: bash
        run: |
          if ! wrangler pages project list | grep -q "$PROJECT_NAME"; then
            wrangler pages project create "$PROJECT_NAME" --production-branch main
          fi

      - name: Deploy Pages
        run: wrangler pages deploy . --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true

      - name: Deployment summary
        run: |
          echo "### VELI deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$PROJECT_NAME.pages.dev" >> "$GITHUB_STEP_SUMMARY"
