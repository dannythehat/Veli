name: Deploy VELI to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: meetveli
      D1_NAME: veli-waitlist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare secrets
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID GitHub Actions secret."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Ensure D1 database exists
        shell: bash
        run: |
          set -euo pipefail
          DB_ID=$(wrangler d1 list --json | jq -r --arg NAME "$D1_NAME" '.[] | select(.name == $NAME) | (.uuid // .database_id // .id)' | head -n1)
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            CREATE_JSON=$(wrangler d1 create "$D1_NAME" --json)
            DB_ID=$(echo "$CREATE_JSON" | jq -r '.uuid // .database_id // .id')
          fi
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Could not resolve the D1 database id."
            exit 1
          fi
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Apply waitlist schema
        run: wrangler d1 execute "$D1_NAME" --remote --file=schema.sql

      - name: Generate Cloudflare Pages config
        shell: bash
        run: |
          cat > wrangler.toml <<EOF
          name = "$PROJECT_NAME"
          pages_build_output_dir = "."
          compatibility_date = "2026-09-28"

          [[d1_databases]]
          binding = "WAITLIST_DB"
          database_name = "$D1_NAME"
          database_id = "$DB_ID"
          EOF

      - name: Ensure Pages project exists
        shell: bash
        run: |
          if ! wrangler pages project list | grep -q "$PROJECT_NAME"; then
            wrangler pages project create "$PROJECT_NAME" --production-branch main
          fi

      - name: Deploy Pages
        run: wrangler pages deploy . --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true

      - name: Deployment summary
        run: |
          echo "### VELI deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$PROJECT_NAME.pages.dev" >> "$GITHUB_STEP_SUMMARY"
