name: Deploy VELI to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a517d133ccec0093de719211a6694951
      PROJECT_NAME: meetveli
      D1_NAME: veli-waitlist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN GitHub Actions secret."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Ensure D1 database exists
        shell: bash
        run: |
          set -euo pipefail
          LIST_JSON=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$D1_NAME&per_page=50")
          DB_ID=$(printf '%s' "$LIST_JSON" | jq -r --arg NAME "$D1_NAME" '.result[]? | select(.name == $NAME) | .uuid' | head -n1)
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            CREATE_JSON=$(curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
              --data "{\"name\":\"$D1_NAME\",\"jurisdiction\":\"eu\"}")
            DB_ID=$(printf '%s' "$CREATE_JSON" | jq -r '.result.uuid // empty')
          fi
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Could not create or resolve the D1 database."
            exit 1
          fi
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Generate Worker config
        shell: bash
        run: |
          cat > wrangler.toml <<EOF
          name = "$PROJECT_NAME"
          main = "worker.js"
          compatibility_date = "2026-09-28"
          workers_dev = true

          [assets]
          directory = "."
          binding = "ASSETS"
          run_worker_first = ["/api/*"]

          [[d1_databases]]
          binding = "WAITLIST_DB"
          database_name = "$D1_NAME"
          database_id = "$DB_ID"
          EOF

      - name: Apply waitlist schema
        run: wrangler d1 execute "$D1_NAME" --remote --file=schema.sql --yes

      - name: Deploy VELI Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          wrangler deploy 2>&1 | tee /tmp/veli-deploy.log
          url=$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/veli-deploy.log | tail -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify live site
        if: steps.deploy.outputs.url != ''
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}/")
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Deployment summary
        run: |
          echo "### VELI deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
